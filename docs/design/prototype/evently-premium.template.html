const photos=__EP_PHOTOS__;
const vendors=__EP_VENDORS__;
const state={screen:'home',history:[],city:'Pune',search:'',category:'All',sort:'relevance',occasion:'',mode:'event',vendor:0,selected:{},saved:new Set(),date:'2027-03-20',guests:60,eventName:'',event:null,linked:false,requests:[],gallery:0,detailTab:'About',sheet:null,checklist:new Set(),theme:'system',notes:'',servicePreferences:{},selectionContext:null,serviceIndex:0,draftQuantity:1,draftPreferences:{},serviceReturn:'build',serviceScroll:0};
__EP_INITIAL_VIEW__
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const unit=t=>({fixed:'fixed',per_plate:'/ plate',per_hour:'/ hour',per_day:'/ day',per_event:'/ event',performance:'/ performance'}[t]||'');
const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Choose a date';
const action=(a,label,cls='ep-primary',extra='')=>`<button type="button" class="${cls}" data-action="${a}" ${extra}>${label}</button>`;
const categories=[['Venue','landmark'],['Catering','utensils'],['Photography','camera'],['Orchestra & Melody','music-2'],['Event Planner','sparkles'],['Decoration','flower-2'],['DJ & Sound','headphones'],['Makeup & Styling','brush'],['Celebrity & Artist','mic-2'],['Videography','clapperboard'],['Other','users']];
const occasions=[['Wedding','heart'],['Birthday','cake'],['Ring ceremony','gem'],['Corporate','briefcase-business'],['Anniversary','flower-2'],['Something else','sparkles']];
const occasionKey=value=>({'ring ceremony':'engagement','birthday party':'birthday',marriage:'wedding',shaadi:'wedding',roka:'engagement'}[value.toLowerCase()]||value.toLowerCase());
const getVendor=()=>vendors[state.vendor];
const menu=()=>[...getVendor().services,...(getVendor().artists||[]).map(a=>({name:a.name,description:a.roleOrSkill,price:a.pricePerPerformance,pricingType:'performance',artist:true}))].map((s,menuId)=>({...s,menuId}));
const selectedItems=()=>menu().map((s,i)=>({...s,id:i,quantity:state.selected[i]||0})).filter(s=>s.quantity>0);
const total=()=>selectedItems().reduce((sum,s)=>sum+s.price*s.quantity,0);
const picture=(v,index=0)=>photos[v.photos[index%v.photos.length]];
const searchForm=()=>`<form data-form="search" class="ep-search">${icon('search')}<input name="search" aria-label="Search occasions, services or vendors" placeholder="Occasion, service or vendor" value="${esc(state.search)}"><button type="button" data-action="submit-form" aria-label="Search">${icon('arrow-right')}</button></form>`;
function header(title,back=true){return `<header class="ep-head">${back?action('back',icon('arrow-left'),'ep-circle','aria-label="Go back"'):action('home',`${icon('asterisk')}evently`,'ep-brand','aria-label="Evently home"')}${title?`<span class="ep-title-small">${esc(title)}</span>`:''}${action('location',`${icon('map-pin')} ${esc(state.city||'All cities')} ${icon('chevron-down')}`,'ep-location','aria-label="Change city"')}</header>`;}
function nav(){return `<nav class="ep-nav" aria-label="Main navigation">${[['home','compass','Explore'],['events','calendar-days','Events'],['saved','heart','Saved'],['profile','user-round','You']].map(([s,i,t])=>action(s,icon(i)+t,'',state.screen===s?'aria-current="page"':'')).join('')}</nav>`;}
function card(v){return `<article class="ep-vendor"><button type="button" class="ep-vendor-open" data-action="vendor" data-id="${v.id}" aria-label="View ${esc(v.businessName)}"><img class="ep-vendor-photo" src="${picture(v)}" alt="Illustrative ${esc(v.vendorType.toLowerCase())} portfolio" loading="lazy"><div class="ep-vendor-info"><div class="ep-vendor-title-row"><h3>${esc(v.businessName)}</h3></div><div class="ep-vendor-kind">${esc(v.vendorType)}</div><div class="ep-vendor-meta">${icon('map-pin')}${esc(v.city)}<span>·</span><span>New</span></div><div class="ep-vendor-price"><span>From <strong>${money(v.startingPrice)}</strong></span><span class="ep-caption">${unit(v.startingUnit)}</span></div></div></button>${action('save',icon('heart'),'ep-save',`data-id="${v.id}" aria-label="${state.saved.has(v.id)?'Unsave':'Save'} ${esc(v.businessName)}" aria-pressed="${state.saved.has(v.id)}"`)}</article>`;}
function home(){return `${header('',false)}<main class="ep-body"><p class="ep-eyebrow">Little moments. Big celebrations.</p><h1>What are you planning?</h1><p class="ep-subtitle">One service or your entire event.</p>${searchForm()}<section class="ep-hero"><img src="${photos.floral}" alt="A candlelit celebration table with flowers"><div class="ep-hero-copy"><p class="ep-eyebrow">Your occasion. Your choices.</p><h2>Your event, made easy.</h2><p class="ep-subtitle">Choose a planner. Pick your services.</p>${action('plan',`Start planning ${icon('arrow-up-right')}`,'')}</div></section><div class="ep-section"><h2>Find a service</h2>${action('browse',`View all ${icon('arrow-right')}`,'ep-link')}</div><div class="ep-service-grid">${categories.slice(0,4).map(([c,i])=>action('category',`<span class="ep-service-icon">${icon(i)}</span>${c==='Orchestra & Melody'?'Live music':c}`,'ep-service-shortcut',`data-category="${c}"`)).join('')}</div><div class="ep-section"><h2>Plan an occasion</h2></div><div class="ep-occasion-row">${occasions.slice(0,4).map(([o,i])=>action('occasion',`${icon(i)} ${o}`,'ep-chip',`data-occasion="${o}"`)).join('')}${action('occasion',`${icon('plus')} Your occasion`,'ep-chip','data-occasion=""')}</div><div class="ep-section"><h2>Vendors near you</h2>${action('browse',`Explore ${icon('arrow-right')}`,'ep-link')}</div>${vendors.filter(v=>v.city===state.city||!state.city).slice(0,2).map(card).join('')}</main>${nav()}`;}
function plan(){return `${header('Your next occasion')}<main class="ep-body"><p class="ep-eyebrow">Let’s make it yours</p><h1>Plan your event</h1><p class="ep-subtitle">Add your occasion and choose your services.</p><div class="ep-plans">${occasions.map(([o,i])=>action('preset',`${icon(i)}${o}`,'ep-plan-choice',`data-occasion="${o==='Something else'?'':o}" aria-pressed="${o==='Something else'?!!state.occasion&&!occasions.some(x=>x[0]===state.occasion):state.occasion===o}"`)).join('')}</div><form data-form="plan"><label class="ep-field"><span class="ep-label">Occasion</span><input class="ep-input" name="occasion" required maxlength="100" placeholder="e.g. Baby shower, housewarming…" value="${esc(state.occasion)}"></label><label class="ep-field"><span class="ep-label">Give it a name <span class="ep-caption">(optional)</span></span><input class="ep-input" name="eventName" maxlength="100" placeholder="e.g. Aarav’s birthday" value="${esc(state.eventName)}"></label><div class="ep-fields"><label class="ep-field"><span class="ep-label">Event date</span><input class="ep-input" name="date" type="date" min="2026-10-27" required value="${state.date}"></label><label class="ep-field"><span class="ep-label">Estimated guests</span><input class="ep-input" name="guests" type="number" min="1" max="10000" required value="${state.guests}"></label></div><label class="ep-field"><span class="ep-label">City</span><input class="ep-input" name="city" required maxlength="80" value="${esc(state.city)}" placeholder="Your event city"></label><div class="ep-note">${icon('sliders-horizontal')}<span>You’re in control. Add a planner, choose individual services, or bring together several vendors.</span></div><button class="ep-primary" type="button" data-action="submit-form">Find my event team ${icon('arrow-right')}</button></form></main>`;}
function filtered(){let list=vendors.filter(v=>(!state.city||v.city.toLowerCase()===state.city.toLowerCase())&&(state.category==='All'||v.vendorType===state.category));const term=state.search.trim().toLowerCase();if(term&&!['wedding','marriage','shaadi','birthday','birthday party','ring ceremony','engagement','corporate','anniversary','roka'].includes(term)){list=list.filter(v=>`${v.businessName} ${v.vendorType} ${v.description} ${v.services.map(s=>s.name).join(' ')}`.toLowerCase().includes(term));}if(state.sort==='low')list.sort((a,b)=>a.startingPrice-b.startingPrice);else if(state.sort==='high')list.sort((a,b)=>b.startingPrice-a.startingPrice);else if(state.occasion)list.sort((a,b)=>Number(b.occasions.includes(occasionKey(state.occasion)))-Number(a.occasions.includes(occasionKey(state.occasion))));return list;}
function results(){const list=filtered();return `${header('Discover vendors')}<main class="ep-body"><p class="ep-eyebrow">${state.occasion?'Made for your occasion':'Find your people'}</p><h1>${state.occasion?esc(state.occasion):'Find a vendor'}</h1><p class="ep-subtitle">${state.linked?`${dateLabel(state.date)} · ${state.guests} guests · ${esc(state.city)}`:'Explore services, see their work, make it yours.'}</p>${searchForm()}<div class="ep-filterbar">${action('filters',`${icon('sliders-horizontal')} Services${state.category==='All'?'':': '+esc(state.category)}`,'ep-chip')}${action('location',`${icon('map-pin')} ${esc(state.city||'All cities')}`,'ep-chip')}${state.occasion?`<span class="ep-chip">${icon('sparkles')} Occasion match first</span>`:''}</div><div class="ep-count"><span>${list.length} demo ${list.length===1?'vendor':'vendors'}</span><select aria-label="Sort vendors" data-change="sort"><option value="relevance" ${state.sort==='relevance'?'selected':''}>Recommended order</option><option value="low" ${state.sort==='low'?'selected':''}>Starting price: low</option><option value="high" ${state.sort==='high'?'selected':''}>Starting price: high</option></select></div>${state.sort!=='relevance'?'<p class="ep-caption" style="margin-bottom:14px">Starting rates use different units. Compare the service details.</p>':''}${list.length?list.map(card).join(''):`<div class="ep-empty">${icon('search')}<h2>A fresh search?</h2><p>No demo vendors match these filters. Try all cities or another service.</p>${action('clear-filters','Clear filters','ep-secondary')}</div>`}</main>${nav()}`;}
function mini(){const v=getVendor();return `<div class="ep-vendor-mini"><img src="${picture(v)}" alt="Illustrative vendor portfolio"><div><h3>${esc(v.businessName)}</h3><p class="ep-caption">${esc(v.vendorType)} · ${esc(v.city)}</p></div></div>`;}
function detail(){const v=getVendor();return `${header('Meet your vendor')}<main class="ep-body"><div class="ep-detail-hero"><img src="${picture(v,state.gallery)}" alt="Illustrative portfolio image ${state.gallery+1}">${action('save',icon('heart'),'ep-save',`data-id="${v.id}" aria-label="${state.saved.has(v.id)?'Unsave':'Save'} ${esc(v.businessName)}" aria-pressed="${state.saved.has(v.id)}"`)}<div class="ep-gallery-controls">${action('prev-photo',icon('chevron-left'),'','aria-label="Previous photo"')}<span>${state.gallery+1} / ${v.photos.length}</span>${action('next-photo',icon('chevron-right'),'','aria-label="Next photo"')}</div></div><div class="ep-detail-title"><div class="ep-eyebrow">${esc(v.vendorType)}</div><h1>${esc(v.businessName)}</h1><div class="ep-meta-line">${icon('map-pin')}${esc(v.city)}<span>·</span><span>New on Evently</span></div></div><div class="ep-tabs" aria-label="Vendor information">${['About','Services','Reviews'].map(t=>action('detail-tab',t,'',`data-tab="${t}" aria-pressed="${state.detailTab===t}"`)).join('')}</div>${state.detailTab==='About'?`<p class="ep-subtitle" style="margin-top:0">${esc(v.description)}</p><div class="ep-section"><h2>About this vendor</h2></div><p class="ep-muted">Choose just one service or combine the things you need from this vendor.</p><div class="ep-occasion-row ep-spaced">${v.occasions.slice(0,4).map(o=>`<span class="ep-tag">${esc(o[0].toUpperCase()+o.slice(1))}</span>`).join('')}</div><div class="ep-section"><h2>Services</h2></div>${serviceLines(v.services.slice(0,3))}${action('show-services',`See all ${menu().length} services & artists ${icon('arrow-right')}`,'ep-link')}`:state.detailTab==='Services'?`<h2>Services & artists</h2><p class="ep-subtitle">Each item can be selected individually.</p>${serviceLines(menu())}`:`<div class="ep-empty">${icon('message-circle')}<h2>A new introduction</h2><p>This demo vendor has no customer reviews yet. Explore their services and discuss your requirements before confirming.</p></div>`}<p class="ep-caption ep-spaced">Portfolio images are illustrative demo images.</p></main><footer class="ep-dock"><div class="ep-dock-summary"><div><p class="ep-caption">${selectedItems().length?`${selectedItems().length} ${selectedItems().length===1?'service':'services'} selected`:'Starting at'}</p><strong class="ep-total">${money(selectedItems().length?total():v.startingPrice)}</strong></div><span class="ep-muted">${selectedItems().length?'Estimated total':unit(v.startingUnit)}<br>Choose what’s included</span></div>${action('build',`Choose services ${icon('arrow-right')}`)}</footer>`;}
function serviceLines(items){return items.map(s=>{const id=s.menuId??getVendor().services.indexOf(s);return `<button type="button" class="ep-service-line ep-service-open" data-action="service-details" data-id="${id}" aria-label="View ${esc(s.name)} details"><span><strong>${esc(s.name)}</strong><span class="ep-caption">${state.selected[id]?'Selected · ':''}View service details ${icon('chevron-right')}</span></span><span><strong>${money(s.price)}</strong><span class="ep-caption">${unit(s.pricingType)}</span></span></button>`;}).join('');}
function progress(step){return `<div class="ep-progress" aria-label="Step ${step} of 3">${['Discover','Personalize','Review'].map((s,i)=>`<span class="${i+1<=step?'ep-current':''}">${String(i+1).padStart(2,'0')} &nbsp; ${s}</span>`).join('')}</div>`;}
__EP_SERVICE_DETAILS__
function serviceChoice(s,i){const selected=!!state.selected[i];const label=serviceProfile(s).quantityLabel;return `<div class="ep-service-card ${selected?'ep-selected':''}"><div class="ep-choice"><input type="checkbox" data-service="${i}" ${selected?'checked':''} aria-label="Select ${esc(s.name)}"><span class="ep-choice-copy">${action('service-details',`<strong>${esc(s.name)}</strong><span class="ep-caption">View details ${icon('chevron-right')}</span>`,'ep-service-name',`data-id="${i}" aria-label="View ${esc(s.name)} details"`)}${s.artist?'<span class="ep-tag">Artist</span>':''}<span class="ep-choice-price">${money(s.price)} <small>${unit(s.pricingType)}</small></span></span></div>${selected?`<div class="ep-selection-details"><span class="ep-tag">${esc(serviceContext())}</span><p class="ep-muted">${esc(s.description||'Detailed inclusions need vendor confirmation.')}</p>${preferenceSummary(i).map(text=>`<p class="ep-caption ep-preference-line">${esc(text)}</p>`).join('')}${action('service-details','Customize for my event','ep-link',`data-id="${i}" aria-label="Customize ${esc(s.name)}"`)}</div><div class="ep-qty"><label for="ep-qty-${i}">${label}</label><div class="ep-stepper">${action('qty-minus',icon('minus'),'',`data-id="${i}" aria-label="Decrease ${esc(s.name)} quantity" ${state.selected[i]<=1?'disabled':''}`)}<input id="ep-qty-${i}" type="number" min="1" max="10000" value="${state.selected[i]}" data-quantity="${i}">${action('qty-plus',icon('plus'),'',`data-id="${i}" aria-label="Increase ${esc(s.name)} quantity"`)}</div></div>`:''}</div>`;}

function build(){return `${header('Make it yours')}<main class="ep-body">${progress(2)}<h1>Choose your services</h1>${mini()}${state.linked?`<p class="ep-muted" style="margin-bottom:12px">${esc(serviceContext())}</p>`:`<label class="ep-field" style="margin-bottom:14px"><span class="ep-label">Occasion (optional)</span><input class="ep-input" data-change="occasion" name="bookingOccasion" maxlength="100" value="${esc(state.occasion)}" placeholder="Birthday, wedding, corporate or any occasion"></label>`}<div class="ep-segment" aria-label="Booking mode">${action('mode','One service','',`data-mode="single" aria-pressed="${state.mode==='single'}"`)}${action('mode','Multiple services','',`data-mode="event" aria-pressed="${state.mode==='event'}"`)}</div><p class="ep-muted" style="margin-bottom:15px">${state.mode==='single'?'Pick one service. Choosing another replaces it.':'Choose any combination. Nothing is added for you.'}</p>${menu().map(serviceChoice).join('')}<div class="ep-section"><h2>Event details</h2></div>${state.linked?`<div class="ep-context">${icon('calendar-days')}<div><strong>${esc(state.event?.name||state.occasion)}</strong><span>${dateLabel(state.date)} · ${esc(state.city)}<br>${state.guests} guests</span></div></div><p class="ep-caption" style="margin-top:10px">Date and city come from your event.</p>`:`<form id="ep-booking-details"><div class="ep-fields"><label class="ep-field"><span class="ep-label">Event date</span><input class="ep-input" name="date" type="date" min="2026-10-27" value="${state.date}" required></label><label class="ep-field"><span class="ep-label">City</span><input class="ep-input" name="city" value="${esc(state.city)}" required maxlength="80" placeholder="Event city"></label></div></form>`}<label class="ep-field"><span class="ep-label">Anything they should know? <span class="ep-caption">(optional)</span></span><textarea class="ep-input" name="notes" maxlength="500" placeholder="Your theme, timings or special requests…">${esc(state.notes)}</textarea></label><div class="ep-note">${icon('info')}<span>This is an estimate. Availability and final inclusions need vendor confirmation.</span></div></main><footer class="ep-dock"><div class="ep-dock-summary"><div><p class="ep-caption">${selectedItems().length} ${selectedItems().length===1?'service':'services'} selected</p><strong class="ep-total" data-total>${money(total())}</strong></div><span class="ep-tag">Estimated total</span></div>${action('review',`Review my selection ${icon('arrow-right')}`,'ep-primary',selectedItems().length?'':'disabled')}</footer>`;}
function review(){return `${header('Review your request')}<main class="ep-body">${progress(3)}<h1>Review your selection</h1><p class="ep-subtitle">Check the details before sending a request.</p>${mini()}<div class="ep-context">${icon('calendar-days')}<div><strong>${esc(state.linked?state.event?.name||state.occasion:'Your service request')}</strong>${dateLabel(state.date)} · ${esc(state.city)}${state.linked?`<br>${state.guests} guests`:''}</div></div><section class="ep-review"><div class="ep-review-title"><h3>Your selection</h3>${action('edit-selection','Edit','ep-link')}</div>${selectedItems().map(s=>`<div class="ep-service-line"><div><strong>${esc(s.name)}</strong><span class="ep-caption">${money(s.price)} ${unit(s.pricingType)} × ${s.quantity}</span>${preferenceSummary(s.id).map(text=>`<p class="ep-caption ep-preference-line">${esc(text)}</p>`).join('')}</div><span><strong>${money(s.price*s.quantity)}</strong></span></div>`).join('')}<div class="ep-review-total"><span>Estimated total</span><strong class="ep-total">${money(total())}</strong></div></section>${state.notes?`<h3>Your note</h3><p class="ep-subtitle">${esc(state.notes)}</p>`:''}<div class="ep-note">${icon('message-circle')}<span>A request starts the conversation. The vendor still needs to confirm availability, inclusions and any extra charges.</span></div><p class="ep-caption">Interactive design preview · no payment or booking will be made.</p></main><footer class="ep-dock">${action('submit-preview',`Preview booking request ${icon('arrow-up-right')}`)}</footer>`;}
function complete(){return `${header('Your request preview')}<main class="ep-body"><div class="ep-success-mark">${icon('check')}</div><div class="ep-success-copy"><p class="ep-eyebrow">Everything in one place</p><h1>Your request is ready</h1><p class="ep-subtitle">Your selection is ready to share with<br>${esc(getVendor().businessName)}.</p></div><div class="ep-review"><div class="ep-review-title"><h3>Request preview</h3><span class="ep-tag">Draft</span></div><div class="ep-service-line"><span>${selectedItems().length} selected services</span><strong>${money(total())}</strong></div><p class="ep-muted ep-spaced">No booking request was sent. This preview shows how the completed request will be organized.</p></div>${action('events',`See my event ${icon('arrow-right')}`)}${action('add-vendor','Explore another vendor','ep-secondary','style="margin-top:12px"')}</main>${nav()}`;}
function events(){const ev=state.event;if(!ev)return `${header('',false)}<main class="ep-body"><p class="ep-eyebrow">Your celebrations</p><h1>My events</h1><div class="ep-empty">${icon('calendar-heart')}<h2>A date to look forward to</h2><p>Create an event to bring your vendors, requests and little details together.</p>${action('plan',`Plan an event ${icon('plus')}`)}</div>${state.requests.length?`<div class="ep-section"><h2>Service drafts</h2></div>${requestList()}`:''}</main>${nav()}`;return `${header('',false)}<main class="ep-body"><p class="ep-eyebrow">Your celebrations</p><h1>My events</h1><section class="ep-event-cover"><p class="ep-eyebrow">${esc(ev.occasion)} · planning</p><h2>${esc(ev.name)}</h2><div class="ep-meta-line">${icon('calendar-days')}${dateLabel(ev.date)}<span>· ${esc(ev.city)}</span></div><div class="ep-meta-line">${icon('users')}${ev.guests} guests</div></section><div class="ep-section"><h2>Your event team</h2>${action('add-vendor',`${icon('plus')} Add vendor`,'ep-link')}</div>${state.requests.filter(r=>r.eventId===ev.id).length?requestList(true):`<div class="ep-empty" style="padding:25px 18px"><h3>There’s room for your people.</h3><p>Add a planner or choose individual services.</p>${action('add-vendor','Find a vendor','ep-secondary')}</div>`}<div class="ep-section"><h2>Checklist</h2><span class="ep-caption">${state.checklist.size} / 3 done</span></div>${['Shortlist your event team','Review the services you need','Confirm details with each vendor'].map((s,i)=>`<label class="ep-checklist"><input type="checkbox" data-checklist="${i}" ${state.checklist.has(i)?'checked':''}><span>${s}</span></label>`).join('')}<div class="ep-note">${icon('info')}<span>Each vendor confirms their own request. Draft totals do not mean services are booked.</span></div></main>${nav()}`;}
function requestList(linkedOnly=false){return state.requests.filter(r=>!linkedOnly||r.eventId===state.event?.id).map(r=>`<div class="ep-review"><div class="ep-review-title"><h3>${esc(r.vendor)}</h3><span class="ep-tag">Draft preview</span></div>${(r.items||[]).map(item=>`<div class="ep-service-line"><div><strong>${esc(item.name)} × ${item.quantity}</strong>${item.preferences.map(text=>`<p class="ep-caption ep-preference-line">${esc(text)}</p>`).join('')}</div></div>`).join('')}<p class="ep-muted" style="margin-top:15px">${r.count} ${r.count===1?'service':'services'} · ${dateLabel(r.date)}</p><div class="ep-review-total"><span>Requested estimate</span><strong>${money(r.total)}</strong></div></div>`).join('');}
function saved(){const list=vendors.filter(v=>state.saved.has(v.id));return `${header('',false)}<main class="ep-body"><p class="ep-eyebrow">Your shortlist</p><h1>Saved vendors</h1><p class="ep-subtitle">Keep the people and possibilities you love.</p><div class="ep-spaced">${list.length?list.map(card).join(''):`<div class="ep-empty">${icon('heart')}<h2>Something will catch your eye.</h2><p>Tap the heart on a vendor to save them here.</p>${action('browse','Explore vendors','ep-secondary')}</div>`}</div></main>${nav()}`;}
function profile(){return `${header('',false)}<main class="ep-body"><p class="ep-eyebrow">Your space</p><div class="ep-avatar">EC</div><h1>Evently customer</h1><p class="ep-subtitle">Demo profile · make yourself at home.</p><div class="ep-spaced">${[['events','calendar-days','My events'],['requests','inbox','Booking request drafts'],['saved','heart','Saved vendors'],['location','map-pin','My city']].map(([a,i,t])=>action(a,`${icon(i)}<span>${t}</span>${icon('chevron-right')}`,'ep-menu')).join('')}</div><div class="ep-section"><h2>Preferences</h2></div><label class="ep-field"><span class="ep-label">Appearance</span><select class="ep-input" data-change="theme">${[['system','Use device setting'],['light','Light & airy'],['dark','After hours']].map(([v,t])=>`<option value="${v}" ${state.theme===v?'selected':''}>${t}</option>`).join('')}</select></label><p class="ep-caption ep-spaced">Design preview with local demo data. Changes here stay in this preview.</p></main>${nav()}`;}
function requests(){return `${header('Your requests')}<main class="ep-body"><p class="ep-eyebrow">The next conversation</p><h1>My requests</h1>${state.requests.length?requestList():`<div class="ep-empty">${icon('inbox')}<h2>No requests just yet</h2><p>Choose a vendor and preview your selected services to see them here.</p>${action('browse','Find a service','ep-secondary')}</div>`}</main>${nav()}`;}
function sheet(){if(!state.sheet)return '';if(state.sheet==='location')return `<section class="ep-sheet" aria-label="Choose your city"><div class="ep-sheet-title"><h2>Where’s the occasion?</h2>${action('close-sheet',icon('x'),'ep-circle','aria-label="Close city chooser"')}</div><form data-form="city"><label><span class="ep-label">City</span><input class="ep-input" name="city" maxlength="80" placeholder="Search any city" value="${esc(state.city)}"></label><div class="ep-occasion-row" style="margin:14px 0">${['Pune','Mumbai','All cities'].map(c=>action('city',c,'ep-chip',`data-city="${c==='All cities'?'':c}"`)).join('')}</div><button class="ep-primary" type="button" data-action="submit-form">Use this city ${icon('check')}</button></form></section>`;return `<section class="ep-sheet" aria-label="Choose a service"><div class="ep-sheet-title"><h2>Find your kind of help</h2>${action('close-sheet',icon('x'),'ep-circle','aria-label="Close filters"')}</div><div class="ep-occasion-row">${[['All','shapes'],...categories].map(([c,i])=>action('filter-category',`${icon(i)}${c}`,'ep-chip',`data-category="${c}" aria-pressed="${state.category===c}"`)).join('')}</div></section>`;}
function render(resetScroll=false){const previousScroll=root.querySelector('.ep-body')?.scrollTop||0;const active=document.activeElement;const attrs=['data-service','data-quantity','data-checklist','data-change','data-action','data-id','data-mode','data-tab','data-category','data-occasion','name'];const focusSelector=active&&root.contains(active)?active.tagName.toLowerCase()+attrs.filter(a=>active.hasAttribute(a)).map(a=>'['+a+'="'+CSS.escape(active.getAttribute(a))+'"]').join(''):null;const views={home,plan,results,detail,build,service:serviceDetails,review,complete,events,saved,profile,requests};app.innerHTML=views[state.screen]();if(state.sheet){const head=app.querySelector('header');head.insertAdjacentHTML('afterend',sheet());}root.style.colorScheme=state.theme==='system'?'light dark':state.theme;if(window.lucide)window.lucide.createIcons({attrs:{width:20,height:20}});const scrollArea=root.querySelector('.ep-body');if(scrollArea)scrollArea.scrollTop=resetScroll?0:previousScroll;if(focusSelector&&focusSelector!=='body')root.querySelector(focusSelector)?.focus({preventScroll:true});}
function notify(text){root.querySelector('#ep-status').textContent=text;}
function go(screen,remember=true){if(remember&&state.screen!==screen)state.history.push(state.screen);state.screen=screen;state.sheet=null;notify('');render(true);root.scrollIntoView({block:'start',behavior:'instant'});}
function freshBrowse(category='All'){state.category=category;state.search='';state.occasion='';state.mode='single';state.linked=false;state.selectionContext=null;go('results');}
function setQuantity(id,value){state.selected[id]=Math.max(1,Math.min(10000,Math.round(Number(value)||1)));render();}
root.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;const id=Number(b.dataset.id);switch(a){
case 'submit-form':{const form=b.closest('form');if(form&&form.reportValidity())submitForm(form);break;}
case 'home':case 'events':case 'saved':case 'profile':case 'requests':state.linked=false;state.occasion='';state.mode='single';go(a);break;
case 'back':if(state.screen==='service'){returnFromService();break;}state.screen=state.history.pop()||'home';state.sheet=null;render(true);root.scrollIntoView({block:'start'});break;
case 'plan':state.linked=false;state.occasion='';state.eventName='';go('plan');break;
case 'occasion':state.occasion=b.dataset.occasion;state.eventName='';state.linked=false;go('plan');break;
case 'preset':state.occasion=b.dataset.occasion;render();if(!state.occasion)root.querySelector('input[name="occasion"]').focus();break;
case 'browse':freshBrowse();break;
case 'category':freshBrowse(b.dataset.category);break;
case 'location':if(state.linked&&state.screen!=='plan'){notify('Date and city are linked to your event.');break;}state.sheet=state.sheet==='location'?null:'location';render();break;
case 'filters':state.sheet=state.sheet==='filters'?null:'filters';render();break;
case 'close-sheet':state.sheet=null;render();break;
case 'city':state.city=b.dataset.city;state.sheet=null;render();break;
case 'filter-category':state.category=b.dataset.category;state.sheet=null;render();break;
case 'clear-filters':state.city='';state.category='All';state.search='';render();break;
case 'vendor':{const context=JSON.stringify([id,state.linked?state.event?.id:'standalone']);if(state.vendor!==id||state.selectionContext!==context){state.selected={};state.servicePreferences={};state.notes='';}state.selectionContext=context;}state.vendor=id;state.gallery=0;state.detailTab='About';go('detail');break;
case 'save':state.saved.has(id)?state.saved.delete(id):state.saved.add(id);render();notify(state.saved.has(id)?'Added to your shortlist.':'Removed from your shortlist.');break;
case 'prev-photo':state.gallery=(state.gallery+getVendor().photos.length-1)%getVendor().photos.length;render();break;
case 'next-photo':state.gallery=(state.gallery+1)%getVendor().photos.length;render();break;
case 'detail-tab':state.detailTab=b.dataset.tab;render();break;
case 'show-services':state.detailTab='Services';render();break;
case 'build':go('build');break;
case 'service-details':openService(id);break;
case 'save-service':saveServiceDetails();break;
case 'remove-service':delete state.selected[state.serviceIndex];returnFromService();break;
case 'detail-minus':updateDraftQuantity(state.draftQuantity-1);break;
case 'detail-plus':updateDraftQuantity(state.draftQuantity+1);break;
case 'mode':state.mode=b.dataset.mode;if(state.mode==='single'){const first=Object.keys(state.selected)[0];state.selected=first===undefined?{}:{[first]:state.selected[first]};}render();break;
case 'qty-minus':setQuantity(id,state.selected[id]-1);break;
case 'qty-plus':setQuantity(id,state.selected[id]+1);break;
case 'review':{if(!selectedItems().length)break;const form=root.querySelector('#ep-booking-details');if(form&&!form.reportValidity())break;if(form){const data=new FormData(form);state.date=String(data.get('date'));state.city=String(data.get('city')).trim();if(!state.city){form.querySelector('[name="city"]').focus();break;}}go('review');break;}
case 'edit-selection':go('build');break;
case 'submit-preview':{const key=JSON.stringify([state.vendor,state.selected,state.date,state.city,state.linked?state.event?.id:null,state.occasion,state.notes,selectedItems().map(s=>[s.id,state.servicePreferences[s.id]||{}])]);if(!state.requests.some(r=>r.key===key))state.requests.push({key,vendor:getVendor().businessName,total:total(),count:selectedItems().length,date:state.date,linked:state.linked,eventId:state.linked?state.event?.id:null,occasion:state.occasion,city:state.city,items:selectedItems().map(s=>({name:s.name,quantity:s.quantity,preferences:preferenceSummary(s.id)}))});state.selectionContext=null;go('complete');break;}
case 'add-vendor':state.category='All';state.search='';if(state.event){state.linked=true;state.city=state.event.city;state.occasion=state.event.occasion;state.date=state.event.date;state.guests=state.event.guests;state.mode='event';}else{state.linked=false;state.mode='single';}go('results');break;
}});
root.addEventListener('input',event=>{const e=event.target;if(e.dataset.pref)state.draftPreferences[e.dataset.pref]=e.value;if(e.name==='notes')state.notes=e.value;if(state.screen==='plan'&&['occasion','eventName','date','city','guests'].includes(e.name))state[e.name]=e.name==='guests'?Number(e.value):e.value;});
root.addEventListener('change',event=>{const e=event.target;if(e.dataset.pref)state.draftPreferences[e.dataset.pref]=e.value;if(e.name==='serviceQuantity')updateDraftQuantity(e.value);if(e.dataset.change==='occasion'){state.occasion=e.value.trim();render();}if(e.dataset.service!==undefined){const id=Number(e.dataset.service);if(e.checked){if(state.mode==='single')state.selected={};state.selected[id]=menu()[id].pricingType==='per_plate'?state.guests:1;}else delete state.selected[id];render();}if(e.dataset.quantity!==undefined)setQuantity(Number(e.dataset.quantity),e.value);if(e.dataset.checklist!==undefined){const id=Number(e.dataset.checklist);e.checked?state.checklist.add(id):state.checklist.delete(id);render();}if(e.dataset.change==='sort'){state.sort=e.value;render();}if(e.dataset.change==='theme'){state.theme=e.value;render();}if(state.screen==='build'&&['date','city'].includes(e.name))state[e.name]=e.value;});
function submitForm(form){if(!form.dataset.form)return;const data=new FormData(form);if(form.dataset.form==='search'){state.search=String(data.get('search')||'').trim();const key=occasionKey(state.search);if(['wedding','birthday','engagement','corporate','anniversary'].includes(key)){state.occasion=state.search;state.mode='event';}else if(!state.linked){state.occasion='';state.mode='single';}go('results');}if(form.dataset.form==='city'){state.city=String(data.get('city')||'').trim();state.sheet=null;render();}if(form.dataset.form==='plan'){const occasion=String(data.get('occasion')||'').trim(),city=String(data.get('city')||'').trim();if(!occasion||!city){notify('Please enter an occasion and a city.');return;}state.occasion=occasion;state.city=city;state.date=String(data.get('date'));state.guests=Number(data.get('guests'));state.eventName=String(data.get('eventName')||'').trim();state.checklist=new Set();state.event={id:Date.now(),name:state.eventName||'My '+state.occasion,occasion:state.occasion,city:state.city,date:state.date,guests:state.guests};state.mode='event';state.linked=true;state.search='';state.category='All';go('results');}}
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.reportValidity())submitForm(event.target);});
root.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input')){const form=event.target.closest('form[data-form]');if(form){event.preventDefault();if(form.reportValidity())submitForm(form);}}});
render();
})();
</script>
